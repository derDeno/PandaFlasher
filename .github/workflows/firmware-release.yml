name: Build firmware release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read firmware versions
        id: version
        run: |
          version=$(sed -nE 's/^#define SOFTWARE_VERSION "(v[0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' firmware/flasher/src/config.h)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          extension_version=$(sed -nE 's/^constexpr char VERSION\[\] = "([0-9]+\.[0-9]+\.[0-9]+)";$/\1/p' firmware/extension/src/main.cpp)
          test -n "$extension_version"
          echo "extension=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: python -m pip install platformio esptool

      - name: Build firmware and filesystem
        run: |
          pio run -d firmware/flasher -e HW-2_0
          pio run -d firmware/flasher -e HW-2_0 -t buildfs
          pio run -d firmware/extension -e rev1
          mkdir -p firmware/extension/data
          pio run -d firmware/extension -e rev1 -t buildfs

      - name: Combine flash image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          EXTENSION_VERSION: ${{ steps.version.outputs.extension }}
        run: |
          python -m esptool --chip esp32s3 merge-bin -o "PandaFlasher-${VERSION}-full.bin" \
            0x0 firmware/flasher/.pio/build/HW-2_0/bootloader.bin \
            0x8000 firmware/flasher/.pio/build/HW-2_0/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 firmware/flasher/.pio/build/HW-2_0/firmware.bin \
            0x5F0000 firmware/flasher/.pio/build/HW-2_0/littlefs.bin
          python -m esptool --chip esp32c3 merge-bin -o "PandaFlasher-Extension-v${EXTENSION_VERSION}-full.bin" \
            0x0 firmware/extension/.pio/build/rev1/bootloader.bin \
            0x8000 firmware/extension/.pio/build/rev1/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 firmware/extension/.pio/build/rev1/firmware.bin \
            0x290000 firmware/extension/.pio/build/rev1/spiffs.bin

      - name: Add images to versioned releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          EXTENSION_VERSION: ${{ steps.version.outputs.extension }}
        run: |
          cp firmware/flasher/.pio/build/HW-2_0/firmware.bin "PandaFlasher-${VERSION}-OTA.bin"
          cp firmware/extension/.pio/build/rev1/firmware.bin "PandaFlasher-Extension-v${EXTENSION_VERSION}-OTA.bin"
          release_image() {
            tag=$1
            title=$2
            shift 2
            if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "$draft" = false ]; then
                echo "Skipping already published $tag"
                return
              fi
              test "$draft" = true
            else
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title"
            fi
            gh release upload "$tag" "$@" --clobber
          }
          release_image "$VERSION" "Flasher $VERSION" \
            "PandaFlasher-${VERSION}-OTA.bin" \
            "PandaFlasher-${VERSION}-full.bin"
          release_image "extension-v${EXTENSION_VERSION}" "Extension v${EXTENSION_VERSION}" \
            "PandaFlasher-Extension-v${EXTENSION_VERSION}-OTA.bin" \
            "PandaFlasher-Extension-v${EXTENSION_VERSION}-full.bin"
