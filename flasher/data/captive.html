<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PandaFlasher Wi-Fi setup</title>
  <style>
    body{font:16px system-ui;max-width:48rem;margin:2rem auto;padding:0 1rem;background:#121821;color:#eee}
    a{color:#8cf}
    section{background:#202b39;padding:1rem;margin:1rem 0;border-radius:.7rem}
    input,button{font:inherit;padding:.45rem;margin:.25rem}
    button{cursor:pointer}
  </style>
</head>
<body>
  <h1>PandaFlasher</h1>
  <h2>Wi-Fi setup</h2>
  <section>
    <form method="post" action="/save">
      <input type="hidden" name="token" value="{{TOKEN}}">
      <label>Network name <input name="ssid" required maxlength="32"></label><br>
      <label>Password <input name="password" type="password" maxlength="63"></label><br>
      <button>Connect</button>
    </form>
  </section>
</body>
</html>
